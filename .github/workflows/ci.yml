name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: preview
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://crm:local-test-only@localhost:5432/crm_test
      DIRECT_URL: postgresql://crm:local-test-only@localhost:5432/crm_test
      TEST_DATABASE_URL: postgresql://crm:local-test-only@localhost:5432/crm_test
      HUSKY: 0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: crm_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm format:check
      - run: pnpm build
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
